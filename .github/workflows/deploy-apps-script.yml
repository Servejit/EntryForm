name: Automatically Update Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - google_apps_script.gs
      - appsscript.json
      - .github/workflows/deploy-apps-script.yml
  workflow_dispatch:

jobs:
  update-apps-script:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Prepare Google authorization
        env:
          CLASPRC_JSON_BASE64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON_BASE64:-}" ]; then
            echo "ERROR: GitHub secret CLASPRC_JSON_BASE64 is missing or empty."
            exit 1
          fi
          if ! printf '%s' "$CLASPRC_JSON_BASE64" | base64 --decode > "$HOME/.clasprc.json"; then
            echo "ERROR: CLASPRC_JSON_BASE64 is not valid Base64."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const p = process.env.HOME + '/.clasprc.json';
          let x;
          try {
            x = JSON.parse(fs.readFileSync(p, 'utf8'));
          } catch (e) {
            console.error('ERROR: Decoded secret is not valid JSON:', e.message);
            process.exit(1);
          }
          const t = x && x.tokens && x.tokens.default;
          if (!t || typeof t !== 'object') {
            console.error('ERROR: Credentials JSON is missing tokens.default.');
            process.exit(1);
          }
          const required = ['client_id', 'client_secret', 'refresh_token'];
          const missing = required.filter(k => typeof t[k] !== 'string' || !t[k]);
          if (missing.length) {
            console.error('ERROR: Credentials are missing required fields:', missing.join(', '));
            process.exit(1);
          }
          console.log('Google credentials JSON valid; tokens.default has the required fields.');
          NODE

      - name: Prepare Apps Script files
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASP_SCRIPT_ID" || { echo "ERROR: Missing CLASP_SCRIPT_ID secret."; exit 1; }
          mkdir -p deploy
          cp google_apps_script.gs deploy/Code.gs
          cat > deploy/appsscript.json <<'JSON'
          {
            "timeZone": "Asia/Kolkata",
            "dependencies": {},
            "exceptionLogging": "STACKDRIVER",
            "runtimeVersion": "V8"
          }
          JSON
          printf '{"scriptId":"%s","rootDir":"."}\n' "$CLASP_SCRIPT_ID" > deploy/.clasp.json
          node -e "JSON.parse(require('fs').readFileSync('deploy/.clasp.json','utf8')); JSON.parse(require('fs').readFileSync('deploy/appsscript.json','utf8')); console.log('clasp config and Apps Script manifest JSON valid')"

      - name: Upload Code.gs to Google Apps Script
        run: |
          set -euo pipefail
          cd deploy
          clasp push --force

      - name: Create version and update existing Web App deployment
        env:
          CLASP_DEPLOYMENT_ID: ${{ secrets.CLASP_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLASP_DEPLOYMENT_ID:-}" ]; then
            echo "ERROR: GitHub secret CLASP_DEPLOYMENT_ID is missing."
            echo "Add the deployment ID of the existing Web App deployment in GitHub repository secrets."
            exit 1
          fi

          cd deploy
          VERSION_OUTPUT="$(clasp version "Automatic GitHub deployment")"
          echo "$VERSION_OUTPUT"
          VERSION_NUMBER="$(printf '%s' "$VERSION_OUTPUT" | grep -oE '[0-9]+' | tail -n 1)"
          if [ -z "$VERSION_NUMBER" ]; then
            echo "ERROR: Could not determine the new Apps Script version number."
            exit 1
          fi

          clasp deploy -i "$CLASP_DEPLOYMENT_ID" -V "$VERSION_NUMBER" -d "Automatically updated from GitHub"
