name: Automatically Update Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - google_apps_script.gs
      - .github/workflows/deploy-apps-script.yml
  workflow_dispatch:

jobs:
  update-apps-script:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Prepare Google authorization
        env:
          CLASPRC_JSON_BASE64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          test -n "$CLASPRC_JSON_BASE64" || { echo "Missing Google authorization secret"; exit 1; }
          printf '%s' "$CLASPRC_JSON_BASE64" | base64 --decode > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); console.log('Google credentials JSON valid')"

      - name: Prepare Apps Script files
        env:
          CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          test -n "$CLASP_SCRIPT_ID" || { echo "Missing CLASP_SCRIPT_ID secret"; exit 1; }
          mkdir -p deploy
          cp google_apps_script.gs deploy/Code.gs
          printf '{"scriptId":"%s","rootDir":"."}\n' "$CLASP_SCRIPT_ID" > deploy/.clasp.json
          node -e "JSON.parse(require('fs').readFileSync('deploy/.clasp.json','utf8')); console.log('clasp config JSON valid')"

      - name: Upload Code.gs to Google Apps Script
        run: |
          cd deploy
          clasp push --force
